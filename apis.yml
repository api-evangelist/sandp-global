aid: sandp-global
name: S&P Global
description: >-
  S&P Global is a leading provider of credit ratings, benchmarks, analytics, and workflow solutions in the global
  capital, commodity, and automotive markets. S&P Global offers multiple API product lines across its business
  divisions: the Capital IQ API provides comprehensive financial and market intelligence data; the Commodity Insights
  API provides price assessments, market data, and analytics for energy and commodities markets; and the Marketplace API
  enables programmatic access to the S&P Global data marketplace catalog.
