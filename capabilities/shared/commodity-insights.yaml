naftiko: "1.0.0-alpha1"

info:
  label: "S&P Global Commodity Insights API"
  description: >-
    Provides RESTful access to commodity price assessments, market data, and
    analytics across energy, metals, agriculture, and petrochemicals markets.
    Formerly known as the Platts API.
  tags:
    - Commodity Data
    - Energy
    - Metals
    - Price Assessments
    - Platts
  created: "2026-05-02"
  modified: "2026-05-02"

binds:
  - namespace: env
    keys:
      PLATTS_API_TOKEN: PLATTS_API_TOKEN

capability:
  consumes:
    - type: http
      namespace: commodity-insights
      baseUri: https://api.platts.com
      description: "S&P Global Commodity Insights (Platts) price assessment and market data API"
      authentication:
        type: bearer
        token: "{{PLATTS_API_TOKEN}}"
      resources:
        - name: prices
          path: /v1/prices
          description: "Commodity price assessments and historical data"
          operations:
            - name: get-latest-prices
              method: GET
              description: "Get most recent price assessments for commodity symbols"
              inputParameters:
                - name: symbol
                  in: query
                  type: string
                  required: true
                  description: "Comma-separated Platts symbol codes"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

            - name: get-price-history
              method: GET
              description: "Get historical price assessments within a date range"
              inputParameters:
                - name: symbol
                  in: query
                  type: string
                  required: true
                  description: "Comma-separated Platts symbol codes"
                - name: startDate
                  in: query
                  type: string
                  required: true
                  description: "Start date YYYY-MM-DD"
                - name: endDate
                  in: query
                  type: string
                  required: true
                  description: "End date YYYY-MM-DD"
                - name: pageSize
                  in: query
                  type: integer
                  required: false
                  description: "Records per page (default 1000)"
                - name: page
                  in: query
                  type: integer
                  required: false
                  description: "Page number"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: reference
          path: /v1/reference
          description: "Commodity reference data and symbol metadata"
          operations:
            - name: get-symbol-reference-data
              method: GET
              description: "Get reference data for commodity symbols"
              inputParameters:
                - name: symbol
                  in: query
                  type: string
                  required: false
                  description: "Filter by symbol codes"
                - name: commodity
                  in: query
                  type: string
                  required: false
                  description: "Filter by commodity type"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: market-data-content-sets
          path: /v1/mdcs
          description: "Market data content set management"
          operations:
            - name: get-price-groups
              method: GET
              description: "Get available price groups and content sets"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8101
      namespace: commodity-insights-api
      resources:
        - path: /v1/prices/latest
          operations:
            - method: GET
              name: get-latest-prices
              description: "Get latest commodity price assessments"
              call: "commodity-insights.get-latest-prices"
              with:
                symbol: "rest.symbol"
              outputParameters:
                - type: object
                  mapping: "$."

        - path: /v1/prices/history
          operations:
            - method: GET
              name: get-price-history
              description: "Get historical commodity price assessments"
              call: "commodity-insights.get-price-history"
              with:
                symbol: "rest.symbol"
                startDate: "rest.startDate"
                endDate: "rest.endDate"
              outputParameters:
                - type: object
                  mapping: "$."

        - path: /v1/reference/symbols
          operations:
            - method: GET
              name: get-symbol-reference-data
              description: "Get commodity symbol reference data"
              call: "commodity-insights.get-symbol-reference-data"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9101
      namespace: commodity-insights-mcp
      transport: http
      tools:
        - name: get-latest-prices
          description: "Retrieve the latest commodity price assessments from Platts"
          hints:
            readOnly: true
            openWorld: true
          call: "commodity-insights.get-latest-prices"
          with:
            symbol: "tools.symbol"
          outputParameters:
            - type: object
              mapping: "$."

        - name: get-price-history
          description: "Retrieve historical commodity price data for a date range"
          hints:
            readOnly: true
            openWorld: false
          call: "commodity-insights.get-price-history"
          with:
            symbol: "tools.symbol"
            startDate: "tools.startDate"
            endDate: "tools.endDate"
          outputParameters:
            - type: object
              mapping: "$."

        - name: get-symbol-reference-data
          description: "Look up commodity symbol metadata and descriptions"
          hints:
            readOnly: true
            openWorld: false
          call: "commodity-insights.get-symbol-reference-data"
          with:
            symbol: "tools.symbol"
          outputParameters:
            - type: object
              mapping: "$."
