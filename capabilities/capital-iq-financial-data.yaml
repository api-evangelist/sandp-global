naftiko: 1.0.0-alpha2
info:
  label: S&P Capital IQ API — Financial Data
  description: 'S&P Capital IQ API — Financial Data. 1 operations. Lead operation: Get Financial Data. Self-contained Naftiko
    capability covering one Sandp Global business surface.'
  tags:
  - Sandp Global
  - Financial Data
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SANDP_GLOBAL_API_KEY: SANDP_GLOBAL_API_KEY
capability:
  consumes:
  - type: http
    namespace: capital-iq-financial-data
    baseUri: https://api-ciq.marketintelligence.spglobal.com/gdsapi/rest
    description: S&P Capital IQ API — Financial Data business capability. Self-contained, no shared references.
    resources:
    - name: v3-clientservice.json
      path: /v3/clientservice.json
      operations:
      - name: getfinancialdata
        method: POST
        description: Get Financial Data
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.SANDP_GLOBAL_API_KEY}}'
  exposes:
  - type: rest
    namespace: capital-iq-financial-data-rest
    port: 8080
    description: REST adapter for S&P Capital IQ API — Financial Data. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/v3/clientservice-json
      name: v3-clientservice-json
      description: REST surface for v3-clientservice.json.
      operations:
      - method: POST
        name: getfinancialdata
        description: Get Financial Data
        call: capital-iq-financial-data.getfinancialdata
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: capital-iq-financial-data-mcp
    port: 9090
    transport: http
    description: MCP adapter for S&P Capital IQ API — Financial Data. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: get-financial-data
      description: Get Financial Data
      hints:
        readOnly: true
        destructive: false
        idempotent: false
      call: capital-iq-financial-data.getfinancialdata
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
