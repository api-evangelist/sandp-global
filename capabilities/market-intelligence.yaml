naftiko: 1.0.0-alpha2
info:
  label: S&P Global Market Intelligence
  description: Unified capability combining S&P Capital IQ financial data and Commodity Insights price assessments for comprehensive
    market intelligence workflows. Used by financial analysts, portfolio managers, and commodity traders to research company
    financials alongside market price data.
  tags:
  - Market Intelligence
  - Financial Data
  - Commodity Insights
  - Analytics
  - S&P Global
  created: '2026-05-02'
  modified: '2026-05-06'
binds:
- namespace: env
  keys:
    CAPITAL_IQ_API_KEY: CAPITAL_IQ_API_KEY
    PLATTS_API_TOKEN: PLATTS_API_TOKEN
capability:
  consumes:
  - type: http
    namespace: capital-iq
    baseUri: https://api-ciq.marketintelligence.spglobal.com/gdsapi/rest
    description: S&P Capital IQ financial data API with comprehensive global company data
    authentication:
      type: bearer
      token: '{{CAPITAL_IQ_API_KEY}}'
    resources:
    - name: authentication
      path: /authenticate/api/v1
      description: Token generation and refresh
      operations:
      - name: generate-auth-token
        method: POST
        description: Generate Bearer access token using SSO credentials
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: financial-data
      path: /v3
      description: Financial and market intelligence data retrieval
      operations:
      - name: get-financial-data
        method: POST
        description: Retrieve financial data for company using function, identifier, and mnemonic
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  - type: http
    namespace: commodity-insights
    baseUri: https://api.platts.com
    description: S&P Global Commodity Insights (Platts) price assessment and market data API
    authentication:
      type: bearer
      token: '{{PLATTS_API_TOKEN}}'
    resources:
    - name: prices
      path: /v1/prices
      description: Commodity price assessments and historical data
      operations:
      - name: get-latest-prices
        method: GET
        description: Get most recent price assessments for commodity symbols
        inputParameters:
        - name: symbol
          in: query
          type: string
          required: true
          description: Comma-separated Platts symbol codes
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-price-history
        method: GET
        description: Get historical price assessments within a date range
        inputParameters:
        - name: symbol
          in: query
          type: string
          required: true
          description: Comma-separated Platts symbol codes
        - name: startDate
          in: query
          type: string
          required: true
          description: Start date YYYY-MM-DD
        - name: endDate
          in: query
          type: string
          required: true
          description: End date YYYY-MM-DD
        - name: pageSize
          in: query
          type: integer
          required: false
          description: Records per page (default 1000)
        - name: page
          in: query
          type: integer
          required: false
          description: Page number
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: reference
      path: /v1/reference
      description: Commodity reference data and symbol metadata
      operations:
      - name: get-symbol-reference-data
        method: GET
        description: Get reference data for commodity symbols
        inputParameters:
        - name: symbol
          in: query
          type: string
          required: false
          description: Filter by symbol codes
        - name: commodity
          in: query
          type: string
          required: false
          description: Filter by commodity type
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: market-data-content-sets
      path: /v1/mdcs
      description: Market data content set management
      operations:
      - name: get-price-groups
        method: GET
        description: Get available price groups and content sets
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    port: 8080
    namespace: market-intelligence-api
    description: Unified REST API for S&P Global market intelligence and commodity data.
    resources:
    - path: /v1/companies/financials
      name: company-financials
      description: Financial data for public and private companies
      operations:
      - method: POST
        name: get-company-financials
        description: Retrieve financial metrics for companies using Capital IQ mnemonics
        call: capital-iq.get-financial-data
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/commodities/prices
      name: commodity-prices
      description: Current commodity price assessments
      operations:
      - method: GET
        name: get-commodity-prices
        description: Retrieve latest commodity price assessments
        call: commodity-insights.get-latest-prices
        with:
          symbol: rest.symbol
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/commodities/history
      name: commodity-price-history
      description: Historical commodity price data
      operations:
      - method: GET
        name: get-commodity-price-history
        description: Retrieve historical commodity price assessments
        call: commodity-insights.get-price-history
        with:
          symbol: rest.symbol
          startDate: rest.startDate
          endDate: rest.endDate
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/commodities/symbols
      name: commodity-symbols
      description: Commodity symbol reference data
      operations:
      - method: GET
        name: get-commodity-symbols
        description: Get reference data for commodity symbols
        call: commodity-insights.get-symbol-reference-data
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    port: 9090
    namespace: market-intelligence-mcp
    transport: http
    description: MCP server for AI-assisted S&P Global market intelligence research.
    tools:
    - name: get-company-financials
      description: Retrieve financial metrics for public or private companies from S&P Capital IQ
      hints:
        readOnly: true
        openWorld: false
      call: capital-iq.get-financial-data
      outputParameters:
      - type: object
        mapping: $.
    - name: get-commodity-prices
      description: Get the latest commodity price assessments from S&P Global Platts
      hints:
        readOnly: true
        openWorld: true
      call: commodity-insights.get-latest-prices
      with:
        symbol: tools.symbol
      outputParameters:
      - type: object
        mapping: $.
    - name: get-commodity-price-history
      description: Retrieve historical commodity price data for trend analysis
      hints:
        readOnly: true
        openWorld: false
      call: commodity-insights.get-price-history
      with:
        symbol: tools.symbol
        startDate: tools.startDate
        endDate: tools.endDate
      outputParameters:
      - type: object
        mapping: $.
    - name: lookup-commodity-symbol
      description: Look up commodity symbol metadata including description, unit, and currency
      hints:
        readOnly: true
        openWorld: false
      call: commodity-insights.get-symbol-reference-data
      with:
        symbol: tools.symbol
      outputParameters:
      - type: object
        mapping: $.
