description: FOCUS-aligned FinOps artifact for S&P Global. Pricing is gated; meters and principles describe
  the expected billing surface. S&P Global APIs and data feeds (Market Intelligence, Capital IQ, Indices,
  Ratings, Platts) are sold under enterprise data licenses. There is no public price list; access is via
  contract with S&P Global sales.
sources:
- https://www.spglobal.com/marketintelligence/en/solutions/marketplace
- https://focus.finops.org/focus-specification/v1-3/
- https://www.finops.org/framework/
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
publisherName: S&P Global Inc.
serviceCategory: Financial Market Data
billingModel:
  pricingCategory: Subscription / Licensed
  billingFrequency: Annual
  billingCurrency: USD
  chargeCategories:
  - Purchase
  - Tax
  - Adjustment
focusColumns:
  ServiceName: S&P Global
  ServiceCategory: Financial Market Data
  ServiceSubcategory: Market Data / Indices
  ProviderName: S&P Global
