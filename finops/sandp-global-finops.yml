meters:
- name: data_license
  unit: month
  aggregation: max
  dimensions:
  - product
  - user_count
- name: api_requests
  unit: request
  aggregation: sum
  dimensions:
  - product
  - feed
  - client_id
- name: data_volume
  unit: GB
  aggregation: sum
  dimensions:
  - product
  - feed
principles:
- name: Visibility
  description: Track consumption per data feed (Capital IQ, Xpressfeed, Marketplace, Indices) using S&P
    Global's customer portal; reconcile against the negotiated user / record / redistribution caps in
    your contract.
- name: Allocation
  description: Tag every downstream consumer (desk, application, fund) so usage caps and redistribution
    clauses can be attributed; required for audit response.
- name: Optimization
  description: Right-size feed scope at renewal — drop unused universes / regions; use delta files (Xpressfeed)
    instead of full snapshots to cut data-volume charges; consolidate users under enterprise licenses
    where it lowers per-seat cost.
- name: Accountability
  description: Market-data manager owns S&P Global vendor relationship, audit responses, and license-cap
    monitoring.
notes: S&P Global APIs and data feeds (Market Intelligence, Capital IQ, Indices, Ratings, Platts) are
  sold under enterprise data licenses. There is no public price list; access is via contract with S&P
  Global sales.
